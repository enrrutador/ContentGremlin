services:
  gremlin:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: bash -c "pip install -r requirements.txt && python main.py"
    env_file:
      - .env
  editor:
    image: node:20-bookworm
    working_dir: /app/video_editor
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: bash -c "apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && npm install && node server.js"
    environment:
      - PORT=3000
