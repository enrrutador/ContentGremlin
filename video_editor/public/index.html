<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Editor</title>
<style>
body{margin:0;font-family:system-ui;background:#0f1115;color:#e6e6e6}
header{padding:10px;background:#161a21;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{display:grid;grid-template-columns:220px 1fr 200px;height:calc(100vh - 48px)}
.panel{padding:10px;background:#12151c;border-right:1px solid #242830;overflow:auto}
.panel.right{border-right:none;border-left:1px solid #242830}
.canvas{padding:10px;overflow:auto}
button{background:#232a37;border:1px solid #2f3747;color:#e6e6e6;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12px}
button.primary{background:#1d4ed8}
input{background:#0f131b;border:1px solid #2a3140;color:#e6e6e6;padding:5px;border-radius:6px}
.clip{display:inline-block;background:#1e3a5f;border:1px solid #3b82f6;border-radius:6px;padding:6px;margin:4px;font-size:11px;cursor:pointer}
.clip.selected{outline:2px solid #60a5fa}
.media-item{padding:6px;border:1px solid #222;margin:4px 0;font-size:12px;cursor:pointer}
.media-item.selected{border-color:#60a5fa}
.bar{height:8px;background:#1a2030;border-radius:4px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:#3b82f6;width:0%}
pre{font-size:11px;max-height:100px;overflow:auto;background:#0a0d12;padding:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.track{border:1px solid #222;margin:6px 0;padding:8px;background:#10151d;border-radius:8px}
</style></head><body>
<header>
<strong>Editor</strong>
<button id="newProj" class="primary">Nuevo</button>
<input id="projId" style="width:200px" placeholder="project id">
<button id="loadProj">Cargar</button>
</header>
<main>
<div class="panel">
<h3>Biblioteca</h3>
<button id="importBtn">Importar</button>
<input type="file" id="fileInp" multiple accept="video/*,audio/*" style="display:none">
<div id="mediaList"></div>
<h3>Gremlin</h3>
<input id="gremlinPath" placeholder="/path/video.mp4" style="width:100%">
<button id="btnGremlin">Import path</button>
<div id="plugins" style="font-size:11px;margin-top:8px"></div>
</div>
<div class="canvas">
<video id="preview" controls style="width:100%;max-height:200px;background:#000"></video>
<div class="bar"><i id="progBar"></i></div>
<div id="progText" style="font-size:11px;opacity:.7">—</div>
<div class="row">
<input type="range" id="scrub" min="0" max="100" step="0.1" value="0" style="flex:1">
<button id="btnFrame">Frame</button>
<button id="btnMontage">Preview montaje</button>
</div>
<div id="timeline"></div>
<div class="row">
<button id="addClip">→ v1</button>
<button id="cutClip">Cortar</button>
<button id="delClip">Borrar</button>
<button id="fadeIn">Fade in</button>
<button id="crossfade">Crossfade</button>
<button id="renderBtn" class="primary">Render</button>
<button id="btnOtio">OTIO↓</button>
<button id="btnOtioIn">OTIO↑</button>
</div>
<pre id="log"></pre>
</div>
<div class="panel right">
<label>W <input id="width" type="number" value="1280" style="width:100%"></label>
<label>H <input id="height" type="number" value="720" style="width:100%"></label>
<div id="clipInfo" style="font-size:11px;margin-top:10px">—</div>
</div>
</main>
<script>
const log=(...a)=>{logEl.textContent+=a.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' ')+'\n'};
const logEl=document.getElementById('log');
let projectId=localStorage.getItem('pid')||'',project=null,selectedMediaId=null,selectedClipId=null;
projId.value=projectId;
async function api(path,opts={}){const r=await fetch(path,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j;}
newProj.onclick=async()=>{const j=await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Demo'})});projectId=j.id;localStorage.setItem('pid',projectId);projId.value=projectId;await load();};
loadProj.onclick=()=>{projectId=projId.value.trim();localStorage.setItem('pid',projectId);load();};
importBtn.onclick=()=>fileInp.click();
fileInp.onchange=async e=>{for(const f of e.target.files){const fd=new FormData();fd.append('file',f);fd.append('projectId',projectId);const r=await fetch('/api/media/import',{method:'POST',body:fd});log('import',await r.json());}await load();};
btnGremlin.onclick=async()=>{const j=await api('/api/integrate/gremlin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'From path',mediaPaths:[gremlinPath.value.trim()],autoAssemble:true})});projectId=j.projectId;localStorage.setItem('pid',projectId);projId.value=projectId;await load();};
addClip.onclick=async()=>{await api('/api/timeline/clips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,trackId:'v1',mediaId:selectedMediaId})});await load();};
cutClip.onclick=async()=>{const c=findClip(selectedClipId);if(!c)return;await api('/api/timeline/cut',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,clipId:selectedClipId,atRelative:c.duration/2})});await load();};
delClip.onclick=async()=>{await api('/api/timeline/clips/'+selectedClipId+'?projectId='+projectId+'&ripple=true',{method:'DELETE'});await load();};
fadeIn.onclick=async()=>{await api('/api/timeline/effects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,clipId:selectedClipId,effectId:'effect.fade_in',params:{duration:1}})});await load();};
crossfade.onclick=async()=>{const v=project.timeline.tracks.find(t=>t.id==='v1');const s=[...v.clips].sort((a,b)=>a.start-b.start);if(s.length<2)return;await api('/api/timeline/transitions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,fromClipId:s[0].id,toClipId:s[1].id,transitionId:'transition.crossfade',duration:1})});await load();};
function setProg(p,t){progBar.style.width=(p||0)+'%';progText.textContent=t||p+'%';}
renderBtn.onclick=async()=>{setProg(0,'queued');const j=await api('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,width:+width.value,height:+height.value})});for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,800));const st=await api('/api/render/'+j.jobId);setProg(st.percent||(st.status==='done'?100:5),st.status+(st.phase?' · '+st.phase:''));if(st.status==='done'){if(st.url)preview.src=st.url;break;}if(st.status==='error')break;}};
btnMontage.onclick=async()=>{setProg(10,'montage…');const j=await api('/api/preview/montage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId})});if(j.url)preview.src=j.url;setProg(100,'preview ok');};
btnOtio.onclick=async()=>{const o=await api('/api/projects/'+projectId+'/otio');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)]));a.download='project.otio.json';a.click();};
btnOtioIn.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{await api('/api/projects/'+projectId+'/otio/import',{method:'POST',headers:{'Content-Type':'application/json'},body:await inp.files[0].text()});await load();};inp.click();};
btnFrame.onclick=()=>{preview.src='';const img=document.createElement('img');img.src='/api/preview/frame?projectId='+projectId+'&t='+scrub.value;};
function findClip(id){if(!project||!id)return null;for(const t of project.timeline.tracks){const c=t.clips.find(x=>x.id===id);if(c)return c;}return null;}
function renderMedia(){mediaList.innerHTML='';(project?.media||[]).forEach(m=>{const d=document.createElement('div');d.className='media-item'+(m.id===selectedMediaId?' selected':'');d.textContent=m.filename+' · '+(m.duration||0).toFixed(1)+'s';d.onclick=()=>{selectedMediaId=m.id;if(m.url)preview.src=m.url;renderMedia();};mediaList.appendChild(d);});}
function renderTimeline(){timeline.innerHTML='';(project?.timeline?.tracks||[]).forEach(t=>{const box=document.createElement('div');box.className='track';box.innerHTML='<strong>'+t.type+' '+t.id+'</strong><br>';t.clips.forEach(c=>{const chip=document.createElement('span');chip.className='clip'+(c.id===selectedClipId?' selected':'');chip.textContent=(c.filename||'clip')+' @'+c.start.toFixed(1);chip.onclick=()=>{selectedClipId=c.id;clipInfo.textContent=JSON.stringify(c,null,1);renderTimeline();};box.appendChild(chip);});timeline.appendChild(box);});}
async function load(){if(!projectId)return;project=await api('/api/projects/'+projectId);renderMedia();renderTimeline();log('loaded',project.name);}
api('/api/plugins').then(j=>{plugins.innerHTML=(j.plugins||[]).map(p=>'<div><code>'+p.id+'</code></div>').join('');}).catch(()=>{});
if(projectId)load();
</script></body></html>
